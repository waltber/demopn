<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Privacy Notice</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: purple !important;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
    }
    header {
      background: #b91c1c;
      color: purple !important;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.5rem; font-weight: 700; color: purple !important; }
    iframe {
      border: none;
      width: 100%;
      display: block;
      height: 800px;
    }
    footer {
      background: #b91c1c;
      color: purple !important;
      padding: 0.8rem;
      text-align: center;
    }
    footer a { color: purple !important; text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Terms</h1>
  </header>

  <iframe
    id="privacy-iframe"
    data-notice-id="f1498d73-d0a8-4771-a554-d43da817af6e"
    src="https://privacy-central.securiti.ai/notice-embed/f1498d73-d0a8-4771-a554-d43da817af6e"
    title="Privacy Notice"
  ></iframe>

  <footer>
    <a href="index.html">Back to Home</a>
  </footer>

  <script>
    (function () {
      const iframe = document.getElementById('privacy-iframe');
      const expectedNoticeId = iframe?.dataset?.noticeId;
      const allowedOrigins = ['https://privacy-central.securiti.ai'];
      let rafId = null;
      let nextHeight = null;
      function applyHeight(h) {
        const heightNumber = Math.max(0, Number(h) || 0);
        iframe.style.height = heightNumber + 'px';
      }
      window.addEventListener('message', function (event) {
        if (!allowedOrigins.includes(event.origin)) return;
        const data = event?.data;
        if (!data || data.type !== 'IFRAME_CONTENT_SIZE') return;
        const payload = data.payload || {};
        if (expectedNoticeId && String(payload.id) !== String(expectedNoticeId)) return;
        nextHeight = payload.height;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          applyHeight(nextHeight);
          rafId = null;
        });
      });
    })();
  </script>
</body>
</html>
